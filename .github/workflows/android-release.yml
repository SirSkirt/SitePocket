name: Android preview APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android arm64 preview
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu GitHub-hosted runners already include Android SDK command-line tools.
      # android-actions/setup-android@v3 currently fails when it tries to
      # install the removed legacy "tools" package.
      - name: Locate Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME"
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDK_MANAGER"
          echo "$(dirname "$SDK_MANAGER")" >> "$GITHUB_PATH"
          echo "Android SDK: $ANDROID_HOME"
          "$SDK_MANAGER" --version
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies
        run: npm install --no-audit --no-fund
      - name: Generate platform icons
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Initialize Android application
        run: npx tauri android init --ci
      - name: Permit only localhost HTTP for imported offline games
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          android = 'http://schemas.android.com/apk/res/android'
          manifest = Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml')
          if not manifest.is_file():
              raise SystemExit('Android manifest was not generated')
          ET.register_namespace('android', android)
          tree = ET.parse(manifest)
          app = tree.getroot().find('application')
          if app is None:
              raise SystemExit('Android application element missing')
          app.set(f'{{{android}}}networkSecurityConfig', '@xml/webcask_network_security')
          tree.write(manifest, encoding='utf-8', xml_declaration=True)
          config = manifest.parent / 'res' / 'xml' / 'webcask_network_security.xml'
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text('''<?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="false" />
            <domain-config cleartextTrafficPermitted="true">
              <domain>127.0.0.1</domain>
              <domain>localhost</domain>
            </domain-config>
          </network-security-config>
          ''', encoding='utf-8')
          print('Configured local-only HTTP for offline HTML5 games')
          PY
      - name: Build installable debug-signed APK
        run: npx tauri android build --apk --debug --target aarch64
      - name: Verify APK output
        shell: bash
        run: |
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print
          test -n "$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SitePocket-Android-arm64-preview
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish Android preview prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-android-preview.${{ github.run_number }}
          name: SitePocket Android Preview ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          body: |
            Early Android arm64 preview, Android 12L/API32+.
            Debug-signed installable APK for manual testing, not a production release.
            Online websites and offline ZIP-imported HTML5 games in Android WebView.
            Per-game drag-to-position multi-touch keyboard layouts.
            Offline ZIP picker/import supported. Folder picker, automatic online-game capture and native shortcuts not supported.
            KeyboardEvents are synthetic and some games may ignore them.
