[package]
name = "webcask-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
walkdir = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
