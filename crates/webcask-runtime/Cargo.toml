[package]
name = "webcask-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
webcask-core = { path = "../webcask-core" }
winit = "0.30"
wry = "0.57"
mime_guess = "2"
percent-encoding = "2"
url = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
ico = "0.4"
